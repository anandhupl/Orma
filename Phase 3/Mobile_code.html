<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Orma AI Tutor - Mobile</title>
    
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

                        "on-background": "#e1e2eb",
                        "surface-container-lowest": "#0b0e14",
                        "on-error-container": "#ffdad6",
                        "surface-container-low": "#191c22",
                        "tertiary": "#fff6e4",
                        "surface-dim": "#10131a",
                        "on-primary-container": "#006a71",
                        "on-secondary": "#480081",
                        "inverse-surface": "#e1e2eb",
                        "on-primary": "#00363a",
                        "on-error": "#690005",
                        "on-secondary-container": "#dcb7ff",
                        "surface-bright": "#363940",
                        "primary-fixed-dim": "#00dbe7",
                        "primary-fixed": "#74f5ff",
                        "secondary-fixed": "#efdbff",
                        "on-primary-fixed": "#002022",
                        "on-surface": "#e1e2eb",
                        "on-secondary-fixed-variant": "#6700b5",
                        "secondary": "#dcb8ff",
                        "tertiary-fixed": "#ffe173",
                        "secondary-fixed-dim": "#dcb8ff",
                        "primary-container": "#00f2ff",
                        "outline": "#849495",
                        "surface-tint": "#00dbe7",
                        "surface-container-high": "#272a31",
                        "on-tertiary-fixed": "#221b00",
                        "on-tertiary-fixed-variant": "#554500",
                        "surface": "#10131a",
                        "secondary-container": "#7701d0",
                        "background": "#10131a",
                        "on-secondary-fixed": "#2c0051",
                        "error": "#ffb4ab",
                        "surface-container": "#1d2026",
                        "tertiary-container": "#fed83a",
                        "inverse-primary": "#00696f",
                        "outline-variant": "#3a494b",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#725e00",
                        "surface-variant": "#32353c",
                        "inverse-on-surface": "#2e3037",
                        "on-primary-fixed-variant": "#004f54",
                        "primary": "#e1fdff",
                        "surface-container-highest": "#32353c",
                        "on-surface-variant": "#b9cacb",
                        "on-tertiary": "#3b2f00"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-shift-bg {
            background: linear-gradient(180deg, #10131a 0%, #0b0e14 100%);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
        /* Drawer Transition States */
        #mobile-drawer {
            transition: transform 0.3s ease-in-out;
        }
        #drawer-backdrop {
            transition: opacity 0.3s ease-in-out;
        }
        .drawer-open #mobile-drawer {
            transform: translateX(0);
        }
        .drawer-open #drawer-backdrop {
            opacity: 1;
            pointer-events: auto;
        }
        /* Added from desktop to support spinner and katex */
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .katex, .katex * { color: #00f2ff !important; border-color: #00f2ff !important; background: transparent !important; }
        .katex { font-size: 1.1em; } 
        .katex-display { 
            font-size: 1.2em; 
            margin: 1rem 0 !important; 
            overflow-x: auto; 
            overflow-y: hidden; 
            max-width: 100%; 
            padding-bottom: 0.5rem;
        }
        #chatWindow p { margin-bottom: 1.1rem !important; line-height: 1.6; }
        #chatWindow p:last-child { margin-bottom: 0 !important; }
        /* Global Dark Scrollbar Overrides */
        html { scrollbar-color: #32353c transparent; scrollbar-width: thin; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #272a31; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a494b; }
        /* Nuke Tailwind Forms plugin focus states */
        textarea:focus, input:focus {
            outline: none !important;
            box-shadow: none !important;
            border-color: transparent !important;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-background font-body select-none" data-mode="connect">

<div class="fixed inset-0 z-[100] pointer-events-none" id="drawer-root">
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm opacity-0 pointer-events-none" id="drawer-backdrop" onclick="toggleDrawer()"></div>
    
    <aside class="absolute left-0 top-0 bottom-0 w-[80%] max-w-[320px] bg-[#0B0E14] border-r border-white/5 transform -translate-x-full flex flex-col pointer-events-auto shadow-2xl" id="mobile-drawer">
        <div class="p-6 border-b border-white/5">
            <div class="flex items-center gap-3 mb-8">
                <h1 class="text-2xl font-bold tracking-tighter text-cyan-400 font-headline">Orma</h1>
            </div>
            <div class="flex items-center gap-3 mb-4">
                <div class="h-8 w-8 rounded-xl bg-secondary-container flex items-center justify-center">
                    <span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">psychology</span>
                </div>
                <div>
                    <h3 class="font-['Inter'] text-sm font-medium tracking-wide text-on-surface">Chat History</h3>
                    <p class="text-[10px] text-gray-400 uppercase tracking-widest">Recent Sessions</p>
                </div>
            </div>
            <button id="newSessionBtn" class="w-full py-3 px-4 rounded-xl bg-primary-container/10 border border-primary-container/20 text-primary-fixed-dim text-xs font-bold hover:bg-primary-container/20 transition-all active:scale-[0.98]">
                + New Session
            </button>
        </div>

        <div class="px-6 py-4 border-b border-white/5">
            <span class="text-[10px] font-label uppercase tracking-[0.2em] text-gray-400 block mb-2">Medium</span>
            <div class="flex items-center bg-[#0b0e14] border border-white/10 rounded-lg p-0.5 shadow-inner w-full">
                <button id="lang-eng" onclick="switchLanguage('eng')" class="lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest bg-primary-container/20 text-primary-fixed-dim shadow-sm transition-all">ENG</button>
                <button id="lang-mal" onclick="switchLanguage('mal')" class="lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest text-on-surface-variant hover:text-white transition-all">MAL</button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto py-4 hide-scrollbar">
            <div id="historyList" class="px-3 space-y-1">
                </div>
        </div>
    </aside>
</div>

<header class="fixed top-0 w-full z-50 bg-slate-950/60 backdrop-blur-xl border-b border-white/10 shadow-[0_0_40px_rgba(0,242,255,0.06)] flex justify-between items-center px-6 h-16">
    <div class="flex items-center gap-3">
        <button class="flex items-center justify-center p-1 active:scale-90 transition-transform" onclick="toggleDrawer()">
            <span class="material-symbols-outlined text-cyan-400" data-icon="menu">menu</span>
        </button>
        <h1 class="text-2xl font-bold tracking-tighter text-cyan-400 font-headline">Orma</h1>
    </div>
    <div class="flex items-center gap-4">
        <div class="flex items-center justify-center">
            <div class="relative flex items-center justify-center h-8 w-8 rounded-full bg-surface-container-high overflow-hidden">
                <span class="material-symbols-outlined text-sm">person</span>
            </div>
        </div>
    </div>
</header>

<main class="pt-16 pb-32 min-h-screen flex flex-col">
    <section class="py-6 bg-surface-container-low/40 border-none sticky top-16 z-40 backdrop-blur-md">
        <div id="subjectContainer" class="flex overflow-x-auto hide-scrollbar px-6 gap-3">
            </div>
    </section>

    <div id="chatWindow" class="px-6 space-y-8 mt-6 flex-1 overflow-y-auto hide-scrollbar pb-10 select-text">
        </div>
</main>

<div id="inputContainerWrapper" class="fixed bottom-0 left-0 w-full px-6 pb-4 pt-4 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/90 to-transparent z-50 flex flex-col items-center gap-2">
    <div id="inputContainer" class="flex items-center gap-2 p-2 pl-4 rounded-2xl bg-surface-variant/40 backdrop-blur-2xl border border-white/5 shadow-[0_-10px_40px_rgba(0,0,0,0.3)] w-full transition-all">
        <textarea id="chatInput" class="flex-grow bg-transparent border-none focus:ring-0 focus:outline-none hide-scrollbar text-on-surface placeholder:text-slate-500 py-3 text-sm pr-2 resize-none max-h-32 overflow-y-auto disabled:opacity-50 transition-all" placeholder="Ask Orma anything..." rows="1"></textarea>
        <div class="flex items-center gap-1 pr-1">
            <button id="sendBtn" class="p-2.5 rounded-xl bg-primary-container text-on-primary-container shadow-[0_0_15px_rgba(0,242,255,0.4)] active:scale-90 transition-all disabled:opacity-50">
                <span id="sendIcon" class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
            </button>
        </div>
    </div>
    <span class="text-[10px] text-gray-400 font-label uppercase tracking-[0.2em] bg-surface-container-lowest/80 px-2 py-0.5 rounded-full inline-block">orma can make mistakes.<br/></span>
</div>

<script>
    // Security & Sanitization Functions (From Desktop)
    function streamSanitizer(text) {
        let safe = text;
        const lastOpenInline = safe.lastIndexOf('\\(');
        const lastCloseInline = safe.lastIndexOf('\\)');
        if (lastOpenInline > lastCloseInline) safe = safe.substring(0, lastOpenInline);
        const lastOpenDisplay = safe.lastIndexOf('\\[');
        const lastCloseDisplay = safe.lastIndexOf('\\]');
        if (lastOpenDisplay > lastCloseDisplay) safe = safe.substring(0, lastOpenDisplay);
        
        safe = safe.replace(/\$\s+/g, '$').replace(/\s+\$/g, '$');
        safe = safe.replace(/\\\(/g, '$').replace(/\\\)/g, '$').replace(/\\\[/g, '$$').replace(/\\\]/g, '$$');
        return safe;
    }
    
    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }
    
    marked.use(window.markedKatex({ throwOnError: false, nonStandard: true }));
    
    const API_BASE = window.location.origin;
    
    // DOM Elements
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const sendIcon = document.getElementById('sendIcon');
    const chatWindow = document.getElementById('chatWindow');
    const inputContainer = document.getElementById('inputContainer');
    const subjectContainer = document.getElementById('subjectContainer');
    const historyList = document.getElementById('historyList');
    const newSessionBtn = document.getElementById('newSessionBtn');
    
    const subjectRegistry = {
        eng: ["Physics", "Chemistry", "English", "Social Science"],
        mal: ["Chemistry"]
    };
    
    let myGhostId = "session_" + Date.now();
    let sessions = JSON.parse(localStorage.getItem('orma_sessions')) || {};
    let currentLanguage = "eng"; // Defaulting to English as per mobile UI constraints
    let currentSubject = "Physics";
    let activeMemory = [];

    // UI Toggle logic
    function toggleDrawer() {
        const root = document.getElementById('drawer-root');
        root.classList.toggle('drawer-open');
        document.body.style.overflow = root.classList.contains('drawer-open') ? 'hidden' : '';
    }
    
    // Core Functions (Adapted for Mobile UI classes)
    function renderSubjectTabs() {
        subjectContainer.innerHTML = '';
        subjectRegistry[currentLanguage].forEach(subject => {
            const isActive = subject === currentSubject;
            const activeClass = "flex-shrink-0 px-6 py-2 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-400/20 text-sm font-medium transition-all active:scale-95";
            const inactiveClass = "flex-shrink-0 px-6 py-2 rounded-full bg-surface-container-high text-slate-400 text-sm font-medium hover:text-slate-200 transition-all";
            const safeId = "btn-" + subject.replace(/\s+/g, '-');
            
            subjectContainer.insertAdjacentHTML('beforeend', `
                <button id="${safeId}" onclick="switchSubject('${subject}')" class="${isActive ? activeClass : inactiveClass}">
                    ${subject}
                </button>
            `);
        });
    }
    
    function switchLanguage(lang) {
        if (currentLanguage === lang) return;
        currentLanguage = lang;
        
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.className = btn.id === 'lang-' + lang 
                ? "lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest bg-primary-container/20 text-primary-fixed-dim shadow-sm transition-all" 
                : "lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest text-on-surface-variant hover:text-white transition-all";
        });
        
        if (!subjectRegistry[currentLanguage].includes(currentSubject)) {
            currentSubject = subjectRegistry[currentLanguage][0];
        }
        resetChatState();
    }

    function switchSubject(newSubject) {
        if (currentSubject === newSubject) return; 
        currentSubject = newSubject;
        resetChatState();
    }
    
    function resetChatState() {
        if (chatWindow.children.length > 0) saveCurrentSession(); 
        myGhostId = "session_" + Date.now();
        chatWindow.innerHTML = '';
        activeMemory = [];
        renderHistory(true);
        renderSubjectTabs();
        setInputState(true);
    }
    
    let saveTimeout;
    function saveCurrentSession() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            if (activeMemory.length === 0) return; 
            const titleText = activeMemory[0].user.substring(0, 25) + "...";
            sessions[myGhostId] = {
                title: titleText,
                subject: currentSubject,
                language: currentLanguage,
                memory: activeMemory 
            };
            localStorage.setItem('orma_sessions', JSON.stringify(sessions));
        }, 1000);
    }
    
    function renderHistory(force = false) {
        if (force || historyList.children.length !== Object.keys(sessions).length) {
            historyList.innerHTML = '';
            Object.keys(sessions).sort((a, b) => b.localeCompare(a)).forEach(id => {
                const data = sessions[id];
                const isActive = id === myGhostId;
                const activeClasses = "group flex items-center gap-3 p-3 rounded-xl bg-violet-900/20 text-violet-300 border-r-2 border-violet-500 cursor-pointer";
                const inactiveClasses = "group flex items-center gap-3 p-3 rounded-xl text-slate-500 hover:text-slate-300 hover:bg-white/5 cursor-pointer transition-colors";
                const icon = data.subject === "Mathematics" ? "calculate" : "auto_stories";

                historyList.insertAdjacentHTML('beforeend', `
                    <div onclick="loadSession('${id}')" class="${isActive ? activeClasses : inactiveClasses}">
                        <span class="material-symbols-outlined text-lg">${icon}</span>
                        <span class="font-['Inter'] text-sm font-medium tracking-wide truncate">${escapeHtml(data.title)}</span>
                    </div>
                `);
            });
        }
    }
    
    function appendMessageToUI(role, text, id = null) {
        if (role === 'user') {
            chatWindow.insertAdjacentHTML('beforeend', `
                <div class="flex flex-col items-end gap-3 ml-auto max-w-[90%]">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[10px] font-label uppercase tracking-widest text-gray-400">You</span>
                    </div>
                    <div class="p-5 rounded-2xl rounded-tr-none bg-cyan-500/10 border border-cyan-400/20 text-on-surface leading-relaxed shadow-[0_0_30px_rgba(0,242,255,0.03)]">
                        <p class="">${escapeHtml(text)}</p>
                    </div>
                </div>`);
        } else {
            const msgId = id || "msg-" + Date.now();
            chatWindow.insertAdjacentHTML('beforeend', `
                <div class="flex flex-col gap-3 max-w-[90%]">
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-6 h-6 rounded-full bg-violet-900/40 flex items-center justify-center">
                            <span class="material-symbols-outlined text-[14px] text-violet-300" data-icon="psychology">psychology</span>
                        </div>
                        <span class="text-[10px] font-label uppercase tracking-widest text-gray-400">Orma AI</span>
                    </div>
                    <div class="p-5 rounded-2xl rounded-tl-none bg-surface-container-high shadow-[0_4px_20px_rgba(0,0,0,0.2)] border-l-2 border-violet-500/30">
                        <div id="${msgId}" class="text-body text-on-surface leading-relaxed space-y-3"></div>
                    </div>
                </div>`);
            
            if(text) {
                document.getElementById(msgId).innerHTML = DOMPurify.sanitize(marked.parse(streamSanitizer(text)));
            } else {
                document.getElementById(msgId).innerHTML = `
                    <div class="flex items-center gap-3 h-6">
                        <div class="flex gap-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-cyan-400/40 animate-bounce"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-cyan-400/40 animate-bounce" style="animation-delay:0.2s"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-cyan-400/40 animate-bounce" style="animation-delay:0.4s"></div>
                        </div>
                    </div>
                `;
            }
            return msgId;
        }
    }

    window.loadSession = function(id) {
        saveCurrentSession(); 
        myGhostId = id;
        const data = sessions[id];
        if (!data) return;

        activeMemory = data.memory || []; 
        currentLanguage = data.language || "eng";
        currentSubject = data.subject || "Physics";
        
        chatWindow.innerHTML = '';
        activeMemory.forEach(turn => {
            appendMessageToUI('user', turn.user);
            appendMessageToUI('ai', turn.ai);
        });
        
        // Sync language toggle UI with the loaded session
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.className = btn.id === 'lang-' + currentLanguage 
                ? "lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest bg-primary-container/20 text-primary-fixed-dim shadow-sm transition-all" 
                : "lang-btn flex-1 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-widest text-on-surface-variant hover:text-white transition-all";
        });
        
        renderSubjectTabs();
        setInputState(true);
        renderHistory(true);
        
        // Auto-close drawer on mobile when session selected
        if (document.getElementById('drawer-root').classList.contains('drawer-open')) {
            toggleDrawer();
        }

        setTimeout(() => chatWindow.scrollTop = chatWindow.scrollHeight, 100);
    };
    
    newSessionBtn.addEventListener('click', () => {
        resetChatState();
        if (document.getElementById('drawer-root').classList.contains('drawer-open')) {
            toggleDrawer();
        }
    });
    
    function setInputState(isReady) {
        if (isReady) {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatInput.placeholder = `Ask Orma anything...`;
            sendBtn.className = "p-2.5 rounded-xl bg-primary-container text-on-primary-container shadow-[0_0_15px_rgba(0,242,255,0.4)] active:scale-90 transition-all";
            sendIcon.className = "material-symbols-outlined text-[20px]";
            sendIcon.innerText = "send";
            inputContainer.classList.remove("opacity-70");
        } else {
            chatInput.disabled = true;
            sendBtn.disabled = true;
            chatInput.placeholder = `Thinking...`;
            sendBtn.className = "p-2.5 rounded-xl bg-surface-container-high text-slate-400 transition-all";
            sendIcon.className = "material-symbols-outlined text-[20px] spinner";
            sendIcon.innerText = "sync";
            inputContainer.classList.add("opacity-70");
        }
    }
    
    window.onload = () => { 
        renderHistory(); 
        renderSubjectTabs(); 
        setInputState(true); 
    };

    // Auto-expand textarea as user types
    chatInput.addEventListener('input', function() {
        this.style.height = 'auto'; // Reset height to properly calculate shrinkage
        this.style.height = this.scrollHeight + 'px'; // Expand to fit new content
    });
    
    chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { // YOU MISSING THIS CHECK
            e.preventDefault();
            if(!sendBtn.disabled) sendBtn.click();
        }
    });
    
    sendBtn.addEventListener('click', async () => {
        const userText = chatInput.value.trim();
        if (!userText) return;
        
        chatInput.value = '';
        chatInput.style.height = 'auto'; // ADD THIS LINE: Reset UI height after sending
        
        appendMessageToUI('user', userText);
        setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
        
        const msgId = appendMessageToUI('ai', '');
        
        setInputState(false);
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 60000); 

            const response = await fetch(`${API_BASE}/ask-orma`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "X-Session-ID": myGhostId
                },
                body: JSON.stringify({ 
                    session_id: myGhostId, 
                    subject: currentSubject, 
                    language: currentLanguage, 
                    message: userText,
                    history: activeMemory 
                }),
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            const msgElement = document.getElementById(msgId);

            if (response.status === 429) {
                msgElement.innerHTML = '<span class="text-yellow-400">⚠️ Slow down! Wait a moment and try again.</span>';
                throw new Error("Rate limited");
            }

            if (!response.ok) {
                const errData = await response.json().catch(() => ({ detail: "Unknown network error." }));
                msgElement.innerHTML = `<span class="text-red-400">Server Error: ${errData.detail}</span>`;
                throw new Error("Backend returned non-200 status.");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let fullText = "";
            let renderTimer;
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break; 
                fullText += decoder.decode(value, { stream: true });
                
                clearTimeout(renderTimer);
                renderTimer = setTimeout(() => {
                    msgElement.innerHTML = DOMPurify.sanitize(marked.parse(streamSanitizer(fullText)));
                    requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
                }, 200); 
            }
            msgElement.innerHTML = DOMPurify.sanitize(marked.parse(streamSanitizer(fullText)));
            
            activeMemory.push({ user: userText, ai: fullText });
            if (activeMemory.length > 5) activeMemory.shift(); 
            
        } catch (error) {
            console.error("Connection failed:", error);
            const msgElement = document.getElementById(msgId);
            if (!msgElement.innerHTML.includes("Server Error") && !msgElement.innerHTML.includes("Slow down")) {
                msgElement.innerHTML = '<span class="text-red-400">Error: Connection failed or timed out. Check your network.</span>';
            }
        } finally {
            setInputState(true);
            saveCurrentSession(); 
            if (activeMemory.length <= 1) {
                renderHistory(true); 
            }
            setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
        }
    });
</script>
</body>
